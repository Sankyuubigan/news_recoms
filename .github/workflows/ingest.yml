name: Ingest Pipeline

on:
  schedule:
    # каждые 2 часа
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (ничего не записывать в ветку data)"
        required: false
        default: "false"

# Два прогона не должны писать одни и те же файлы одновременно
concurrency:
  group: ingest
  cancel-in-progress: false

# contents: write нужен, когда данные лежат в этом же репозитории (форк без
# своего приватного репо). Если заданы DATA_REPO + DATA_REPO_TOKEN, запись идёт
# через PAT в другой репозиторий, а GITHUB_TOKEN не используется.
permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: repo

      # --- Ветка data: цель определяется наличием секретов, без хардкода владельца.
      # Заданы DATA_REPO + DATA_REPO_TOKEN → пишем в приватный репозиторий данных.
      # Не заданы (форк, локальный проект) → пишем в этот же репозиторий.
      - name: Prepare data branch
        working-directory: repo
        env:
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          SELF_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "${DATA_REPO}" ] && [ -n "${DATA_REPO_TOKEN}" ]; then
            TARGET="${DATA_REPO}"
            TOKEN="${DATA_REPO_TOKEN}"
            echo "Данные: приватный репозиторий ${TARGET}"
          else
            TARGET="${SELF_REPO}"
            TOKEN="${GITHUB_TOKEN}"
            echo "Данные: текущий репозиторий ${TARGET}"
          fi

          # Токен не печатаем и не подставляем в URL: credential helper пишет
          # одну строку в файл, который удаляется отдельным шагом.
          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' "${TOKEN}" > ~/.git-credentials
          chmod 600 ~/.git-credentials
          REMOTE="https://github.com/${TARGET}.git"

          # actions/checkout оставляет глобальный http.extraheader с GITHUB_TOKEN,
          # который перекрывает credential helper: запросы к приватному репо шли
          # с чужим токеном и получали 404 → «ветки нет» на существующей ветке.
          git config --global --unset-all http.https://github.com/.extraheader || true
          export GIT_TERMINAL_PROMPT=0

          # Наличие ветки определяем клонированием, а не ls-remote: так проверяется
          # ровно тот путь доступа, которым потом идёт push.
          rm -rf data_repo
          if git clone --quiet --branch data --single-branch "${REMOTE}" data_repo; then
            echo "Ветка data существует — клонировали"
          else
            echo "Ветки data нет — создаём orphan"
            rm -rf data_repo
            mkdir data_repo
            cd data_repo
            git init -q
            git checkout -q --orphan data
            git remote add origin "${REMOTE}"
            # Пустой коммит, чтобы ветка существовала до первого прогона пайплайна
            git commit -q --allow-empty -m "chore: init data branch"
            git push -q origin data
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: repo/pipeline/requirements.txt

      - name: Install dependencies
        working-directory: repo/pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: repo/pipeline
        run: python -m pytest -q

      - name: Run pipeline
        working-directory: repo/pipeline
        env:
          # Структура провайдеров — в repo/pipeline/providers.json (правится в вебе GitHub).
          # Здесь только сами ключи, по одному короткому значению на провайдера.
          GEMINI_KEY_1: ${{ secrets.GEMINI_KEY_1 }}
          GEMINI_KEY_2: ${{ secrets.GEMINI_KEY_2 }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          # Старый способ (весь JSON одной строкой) — работает, если задан.
          LLM_PROVIDERS_JSON: ${{ secrets.LLM_PROVIDERS_JSON }}
          GEMINI_VIDEO_API_KEY: ${{ secrets.GEMINI_VIDEO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python main.py --data-dir ../data_repo

      # --- Коммит и пуш с ретраями: юзер мог лайкнуть в ту же секунду
      - name: Commit and push data
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: repo/data_repo
        run: |
          set -euo pipefail
          git add -A

          if git diff --cached --quiet; then
            echo "Нет изменений — пуш не нужен"
            exit 0
          fi

          git commit -q -m "chore: ingest update [skip ci]"

          for attempt in 1 2 3; do
            echo "Попытка пуша $attempt"
            if git pull --rebase --autostash origin data && git push origin data; then
              echo "Запушено"
              exit 0
            fi
            sleep $((attempt * 5))
          done

          echo "Не удалось запушить после 3 попыток" >&2
          exit 1

      - name: Cleanup credentials
        if: always()
        run: rm -f ~/.git-credentials
