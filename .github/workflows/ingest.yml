name: Ingest Pipeline

on:
  schedule:
    # каждые 2 часа
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (не писать в БД)"
        required: false
        default: "false"

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        working-directory: pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: pipeline
        run: python -m pytest

      - name: Run pipeline
        working-directory: pipeline
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          LLM_PROVIDERS_JSON: ${{ secrets.LLM_PROVIDERS_JSON }}
          GEMINI_VIDEO_API_KEY: ${{ secrets.GEMINI_VIDEO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python main.py
