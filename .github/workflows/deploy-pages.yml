name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Build
        working-directory: app
        env:
          # Приватный репозиторий с данными. Задаётся в Settings → Variables
          # (не Secret: значение попадает в бандл, чтобы фронт знал, куда читать).
          # В форки не наследуется — форкер по умолчанию пишет в свой репозиторий.
          VITE_DATA_REPO: ${{ vars.DATA_REPO }}
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Автовключение Pages при первом прогоне (нужен публичный репозиторий
          # на бесплатном плане: приватные репо Pages не публикуют)
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
